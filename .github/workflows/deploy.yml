name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # ── Infrastructure ────────────────────────────────────────────
  ACR_LOGIN_SERVER:  ${{ secrets.ACR_LOGIN_SERVER }}
  CONTAINER_APP:     ${{ secrets.CONTAINER_APP }}
  RESOURCE_GROUP:    ${{ secrets.RESOURCE_GROUP }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  # ── ONE service principal (Default Directory): deploys + reads/writes Cosmos ──
  CLIENT_ID:     ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  TENANT_ID:     ${{ secrets.TENANT_ID }}

  # ── App runtime: Cosmos DB (not secret) ───────────────────────
  COSMOS_ENDPOINT: https://tst-cosmos-db.documents.azure.com:443/
  COSMOS_DATABASE: tst-db

  # ── App runtime: Entra External ID, customer sign-in (not secret) ──
  ENTRA_TENANT_SUBDOMAIN: tstcustomers
  ENTRA_TENANT_ID:        8cc59ab2-a767-4059-b8e7-4ba0a455907a
  ENTRA_CLIENT_ID:        831c423f-b978-4f7d-9fb2-e541dadedccd

  # ── App runtime: CORS allowlist = the Static Web App origin ───
  ALLOWED_ORIGINS: https://lemon-cliff-0b2596c0f.3.azurestaticapps.net

  # ── Frontend / Static Web App ─────────────────────────────────
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

jobs:
  deploy-backend:
    name: Build & deploy backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: echo "$CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" --username "$CLIENT_ID" --password-stdin

      - name: Build and push image
        run: |
          IMAGE=$ACR_LOGIN_SERVER/$CONTAINER_APP:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Let the Container App pull from ACR (SP creds)
        run: |
          az containerapp registry set \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_LOGIN_SERVER" \
            --username "$CLIENT_ID" --password "$CLIENT_SECRET"

      - name: Store runtime secret on the Container App
        run: |
          az containerapp secret set \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --secrets cosmos-sp-secret="$CLIENT_SECRET"

      - name: Configure ingress (port 8000)
        run: |
          az containerapp ingress update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --target-port 8000

      - name: Deploy image + env to Container App
        # Smallest size, scale to zero when idle (a few seconds' cold start on the first request).
        # For no cold starts set --min-replicas 1 (about $4-6/month more at this size).
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$CONTAINER_APP:${{ github.sha }}" \
            --min-replicas 0 --max-replicas 1 \
            --cpu 0.25 --memory 0.5Gi \
            --set-env-vars \
              AZURE_CLIENT_ID="$CLIENT_ID" \
              AZURE_TENANT_ID="$TENANT_ID" \
              AZURE_CLIENT_SECRET=secretref:cosmos-sp-secret \
              COSMOS_ENDPOINT="$COSMOS_ENDPOINT" \
              COSMOS_DATABASE="$COSMOS_DATABASE" \
              ENTRA_TENANT_SUBDOMAIN="$ENTRA_TENANT_SUBDOMAIN" \
              ENTRA_TENANT_ID="$ENTRA_TENANT_ID" \
              ENTRA_CLIENT_ID="$ENTRA_CLIENT_ID" \
              ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
              APP_ENVIRONMENT="production"

  deploy-frontend:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Derive the backend's public URL so the SPA can call it directly (bearer + CORS).
      - name: Login to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Resolve Container App URL
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
                 --query properties.configuration.ingress.fqdn -o tsv)
          echo "VITE_API_BASE_URL=https://$FQDN" >> "$GITHUB_ENV"

      # VITE_API_BASE_URL is PUBLIC (the backend URL). Sign-in settings come from the backend's
      # /api/config at runtime, so no other value is baked into the bundle.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
